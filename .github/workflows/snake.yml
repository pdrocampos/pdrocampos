# Caminho no repositório: .github/workflows/snake.yml
name: Gerar Snake Animation

on:
  schedule:
    # Atualiza 1x por dia
    - cron: "0 3 * * *"
  workflow_dispatch:   # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=A855F7&color_dots=#ede9fe,#c4b5fd,#a855f7,#7c3aed,#4c1d95
            dist/github-snake-dark.svg?color_snake=A855F7&color_dots=#161b22,#4c1d95,#7c3aed,#9333ea,#a855f7

      - name: Publicar no branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
